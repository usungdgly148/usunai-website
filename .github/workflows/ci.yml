name: Verify code baseline

on:
  push:
    branches: [main, "feature/**", "fix/**", "recovery/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify repository
        run: npm run verify

      - name: Install server dependencies for integration checks
        run: npm ci --prefix server

      - name: Run isolated backend integration checks
        run: npm run check:stage-d:integration

      - name: Install recovered frontend dependencies
        run: npm ci --prefix frontend

      - name: Build recovered frontend source
        run: npm run build --prefix frontend
