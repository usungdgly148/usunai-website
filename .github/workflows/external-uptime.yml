name: External uptime probe

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: external-uptime-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public endpoints from outside the server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 --retry 2 https://usunai.top/ | grep -Fq '友尚AI'
          curl --fail --silent --show-error --location --max-time 15 --retry 2 https://usunai.top/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True'
          curl --fail --silent --show-error --location --max-time 15 --retry 2 --output /dev/null https://usunai.top/admin/login
