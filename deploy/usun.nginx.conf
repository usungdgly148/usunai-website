# 友尚 AI 站点（HTTPS 基线）
# 小程序端生产构建强制要求 HTTPS API（见 miniapp/config/index.ts），
# 因此本配置以 443 为主入口，80 仅保留 ACME 验证并整体跳转 HTTPS。
#
# 证书签发（certbot 默认布局）：
#   sudo certbot certonly --webroot -w /var/www/certbot -d usunai.top -d www.usunai.top
# 签发后先执行 nginx -t 校验，再 systemctl reload nginx。

server {
    listen 80;
    listen [::]:80;
    server_name usunai.top www.usunai.top;

    # ACME http-01 验证保留在 80 端口
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name usunai.top www.usunai.top;

    ssl_certificate     /etc/letsencrypt/live/usunai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usunai.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
