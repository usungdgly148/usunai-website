# 友尚 AI 站点（HTTPS：80 跳 443，443 反代 127.0.0.1:8787）
#
# ⚠️ 本文件此前与线上长期不一致：线上 /etc/nginx/conf.d/usun.conf 手工加过
#    安全响应头（HSTS / nosniff / X-Frame-Options / Referrer-Policy / Permissions-Policy / CSP）
#    与 RSA 备用证书，仓库里都没有。2026-09-12 已按线上实际内容回填，之后请以本文件为准。
#
# 证书签发 / 续期：
#   sudo certbot certonly --webroot -w /var/www/certbot -d usunai.top -d www.usunai.top
# ⚠️ TLS 双栈：ECDSA 与 RSA 两张证书都要保留（LE Gen Y 起 certbot 默认只签 ECDSA，
#    RSA-only 客户端会报 SSL alert 40）。RSA 补签：
#   sudo certbot --key-type rsa --preferred-chain "ISRG Root X1" --cert-name usunai.top-rsa
# 改完先 nginx -t 校验，再 systemctl reload nginx。

# HTTP: 80 -> 301 到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name usunai.top www.usunai.top;

    # certbot 续期需要（webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 443 -> 127.0.0.1:8787 (Node 后端)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name usunai.top www.usunai.top;

    ssl_certificate     /etc/letsencrypt/live/usunai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usunai.top/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/usunai.top-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usunai.top-rsa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP 里两处微信白名单是网页扫码登录的硬依赖（2026-09-12 补，删了扫码就废）：
    #   script-src  https://res.wx.qq.com        → 官方内嵌二维码 SDK wxLogin.js
    #   frame-src   https://open.weixin.qq.com   → SDK 塞进来的登录 iframe
    #   另注：iframe 确认后会自己跳到 www.usunai.top/api/wechat/callback，
    #   所以 frame-src 必须同时保留 'self'。
    #   ⚠️ 不要自己用 qrcode 库画 qrconnect 链接，那样手机扫码只会打开网页（套娃）且零回调。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://res.wx.qq.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https://open.weixin.qq.com; form-action 'self'; upgrade-insecure-requests" always;

    # 微信扫码回调页：SDK 用 self_redirect=true，所以这一页是显示在**微信 SDK 的 iframe 里**的
    # （祖先就是本站 SPA 页）。因此它必须能"被本站同源 iframe 嵌入"：
    #   · 不能带 X-Frame-Options: DENY（外层 server 那段默认带着）—— nginx 的 add_header 是
    #     "本层一旦出现 add_header 就整体覆盖上层"，所以这里写任意一条即可把外层那套头(含 XFO)丢掉；
    #   · CSP 用 frame-ancestors 显式放行 apex 与 www 两个来源
    #     （用户可能从 usunai.top 或 www.usunai.top 进站，两个 origin 都要允许）。
    # 注：即便这页渲染被拦，服务端也已经签发票据、前端轮询照样能登录；但界面会闪一个
    #     "refused to frame" 错误页，所以必须单独放行。
    location = /api/wechat/callback {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors https://usunai.top https://www.usunai.top" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 工作流最长 10 分钟（AI 视频/图片生成），放开 SSE 长流式超时
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
